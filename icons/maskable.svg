<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#0B3B8F"/><g transform="translate(18 18) scale(0.7)">
  <circle cx="60" cy="60" r="58" fill="#0B3B8F"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <clipPath id="c"><circle cx="60" cy="60" r="51"/></clipPath>
  <g clip-path="url(#c)" fill="#FFFFFF">
    <!-- cabeza -->
    <circle cx="60" cy="38" r="12.5"/>
    <!-- gorra: copa + visera -->
    <path d="M46.5,36 C46.5,22 54,19.5 60,19.5 C67,19.5 73.5,23 73.5,35 L73.5,36.5 Z"/>
