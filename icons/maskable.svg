  </g>
  <g clip-path="url(#c)">
    <!-- antebrazo en diagonal: codo junto a la cadera, mano a la altura del corazón -->
    <line x1="33" y1="101" x2="67" y2="75" stroke="#0B3B8F" stroke-width="17" stroke-linecap="round"/>
    <line x1="33" y1="101" x2="67" y2="75" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <!-- puño de la manga -->
    <line x1="56.6" y1="75.6" x2="63.4" y2="84.4" stroke="#0B3B8F" stroke-width="1.8"/>
    <!-- llave pegada al cuerpo: del puño hacia el hombro -->
    <g transform="rotate(-58 70 72)">
      <rect x="60" y="68.6" width="36" height="6.8" rx="3.4" fill="#0B3B8F"/>
      <rect x="61" y="69.6" width="34" height="4.8" rx="2.4" fill="#FFFFFF"/>
      <circle cx="98" cy="72" r="8.2" fill="#0B3B8F"/>
      <circle cx="98" cy="72" r="6.2" fill="#FFFFFF"/>
      <rect x="99" y="69" width="9" height="6" fill="#0B3B8F"/>
      <circle cx="60" cy="72" r="3.4" fill="#0B3B8F"/>
    </g>
    <!-- puño -->
    <rect x="62" y="68" width="14" height="11" rx="4.5" fill="#0B3B8F"/>
    <rect x="63.6" y="69.6" width="10.8" height="7.8" rx="3.4" fill="#FFFFFF"/>
    <path d="M64,73.5 H74" stroke="#0B3B8F" stroke-width="1.2"/>
